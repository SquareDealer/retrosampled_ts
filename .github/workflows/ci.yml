name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, unit, e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retro
          POSTGRES_PASSWORD: retro
          POSTGRES_DB: retrosamples_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retro -d retrosamples_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://retro:retro@127.0.0.1:5432/retrosamples_test?schema=public
      JWT_SECRET: ci-secret-at-least-16-chars

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @retrosampled/backend prisma:generate

      - name: Typecheck
        run: pnpm --filter @retrosampled/backend typecheck

      - name: Unit tests
        run: pnpm --filter @retrosampled/backend test

      - name: E2E tests
        run: pnpm --filter @retrosampled/backend test:e2e

      - name: Build
        run: pnpm --filter @retrosampled/backend build

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @retrosampled/frontend typecheck

      - name: Unit tests
        run: pnpm --filter @retrosampled/frontend test

      - name: Build
        run: pnpm --filter @retrosampled/frontend build
