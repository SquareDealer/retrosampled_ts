# Local Postgres for development.
# Start with: docker compose up -d
# The backend reads DATABASE_URL from apps/backend/.env
services:
  postgres:
    image: postgres:16-alpine
    container_name: retrosamples-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro
      POSTGRES_DB: retrosamples
    ports:
      - "5432:5432"
    volumes:
      - retrosamples_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retrosamples"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  retrosamples_pgdata:
